name: Validate and package Bedrock prototypes
on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "bedrock/packs/**"
      - ".github/workflows/bedrock-prototypes.yml"
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Java model conversion
        run: node --test tests/java_model_to_bedrock.test.mjs
      - name: Check Python syntax
        run: python -m py_compile tools/build_bedrock_packs.py tools/tabula_inspect.py
      - name: Build prototype mcaddons
        run: |
          python tools/build_bedrock_packs.py waystones
          python tools/build_bedrock_packs.py mowzie
      - uses: actions/upload-artifact@v4
        with:
          name: Minizin-Bedrock-Prototypes
          path: build/*.mcaddon
          if-no-files-found: error
