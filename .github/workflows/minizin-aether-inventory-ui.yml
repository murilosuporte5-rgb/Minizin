name: Minizin Aether inventory UI patch
on:
  pull_request:
    paths:
      - "tools/minizin_inventory_accessories_ui.py"
      - "tests/test_minizin_inventory_accessories_ui.py"
      - ".github/workflows/minizin-aether-inventory-ui.yml"
  workflow_dispatch:
jobs:
  ui-offline-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Syntax-check installer
        run: python -m py_compile tools/minizin_inventory_accessories_ui.py
      - name: Run UI regression fixtures
        run: python -m unittest discover -s tests -p test_minizin_inventory_accessories_ui.py -v
