name: Minizin creatures scoped checks
on:
  push:
    branches: [feature/minizin-creatures]
    paths: ['bedrock/packs/creatures/**', 'tests/creatures_logic.test.mjs', '.github/workflows/minizin-creatures-checks.yml']
  pull_request:
    paths: ['bedrock/packs/creatures/**', 'tests/creatures_logic.test.mjs', '.github/workflows/minizin-creatures-checks.yml']
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Parse JS
        run: |
          for f in bedrock/packs/creatures/BP/scripts/*.js; do node --input-type=module --check < "$f"; done
      - name: Behavioral boundaries
        run: node --test tests/creatures_logic.test.mjs
      - name: Validate JSON definitions and forbidden texture fallback
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('bedrock/packs/creatures/BP')
          for f in p.rglob('*.json'):
              json.loads(f.read_text())
          assert len(list((p/'entities').glob('*.json')))==10
          assert not list(pathlib.Path('bedrock/packs/creatures').rglob('*.png'))
          print('PASS: ten entity definitions, JSON schemas parse, no substituted PNG')
          PY
      - name: Compile Python builder
        run: python -m py_compile bedrock/packs/creatures/build_creatures.py
      - name: Refuse pack without original assets
        run: |
          if python bedrock/packs/creatures/build_creatures.py; then
            echo "ERROR: build must refuse missing authorization"; exit 1
          fi
  stage-original-assets:
    # Build/inspect inside ephemeral runner; never upload copyrighted assets.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Check out pinned Java source modules
        run: |
          git submodule update --init --depth 1 --recommend-shallow \
            mods/16-ice-and-fire/upstream \
            mods/42-alexs-caves/upstream \
            mods/43-cataclysm/upstream \
            mods/44-mowzies-mobs/upstream
      - name: Recover previously converted original geometry
        run: |
          git fetch --depth=1 origin generated-bedrock:refs/remotes/origin/generated-bedrock
          git restore --source=origin/generated-bedrock --worktree -- \
            generated/conversions/ice_and_fire \
            generated/conversions/alex_caves \
            generated/conversions/cataclysm
      - name: Stage, inspect, then discard Bedrock visual packs
        run: python bedrock/packs/creatures/build_creatures.py --validate-only
      - name: Assert no publishable asset files remain
        run: |
          test ! -e build/Minizin_Creatures_Research.mcaddon
          test ! -e build/creatures_staged
          echo "PASS: built and validated privately; no packaged third-party data retained"
